name: Sense RD

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Кастомное название приложения
  APP_NAME: "WozeRD"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg with Github Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          git checkout 2024.07.12
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install vcpkg dependencies
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
          & "$env:VCPKG_ROOT\vcpkg" install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: pwsh

      - name: Patch config with custom server
        run: |
          $configFile = "libs/hbb_common/src/config.rs"
          $content = Get-Content $configFile -Raw
          $content = $content -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];', 'pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ secrets.RENDEZVOUS_SERVER }}"];'
          $content = $content -replace 'pub const RS_PUB_KEY: &str = "[^"]*";', 'pub const RS_PUB_KEY: &str = "${{ secrets.RS_PUB_KEY }}";'
          $content = $content -replace 'pub const RENDEZVOUS_SERVER: &str = "[^"]*";', 'pub const RENDEZVOUS_SERVER: &str = "${{ secrets.RENDEZVOUS_SERVER }}";'
          Set-Content $configFile $content
          Write-Host "Config patched successfully"
        shell: pwsh

      - name: Build rustdesk
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
          python build.py --portable --hwcodec --flutter
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: flutter/build/windows/x64/runner/Release/
