name: Sense RD Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "962e5e39f8a25f42522f51fffc574e05a3efd26b"

      - name: Install vcpkg deps
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Patch server config
        run: |
          $file = "libs/hbb_common/src/config.rs"
          (Get-Content $file) -replace 'RENDEZVOUS_SERVER: &str = ""', 'RENDEZVOUS_SERVER: &str = "${{ secrets.RENDEZVOUS_SERVER }}"' | Set-Content $file
          (Get-Content $file) -replace 'RS_PUB_KEY: &str = ""', 'RS_PUB_KEY: &str = "${{ secrets.RS_PUB_KEY }}"' | Set-Content $file
          Write-Host "Patched config.rs"
        shell: pwsh

      - name: Build
        run: python build.py --portable --hwcodec --flutter
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SenseRD-Windows
          path: flutter/build/windows/x64/runner/Release/
